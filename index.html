<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Подход</title>
<meta name="theme-color" content="#0e1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Подход">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#0e1013;--card:#181b20;--line:#2a2f37;--text:#f2f4f7;--mute:#8b93a1;--acc:#b6f23c;--acc-ink:#11150a;--bad:#ff6b5e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
#app{min-height:100%;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 88px)}
h1{font-size:28px;margin:8px 0 2px;letter-spacing:-.02em}
h2{font-size:15px;margin:24px 0 8px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
p{margin:0}
.sub{color:var(--mute);margin-bottom:16px}
button,input,select{font:inherit;color:inherit}
button{border:0;border-radius:14px;background:var(--line);padding:12px 16px;font-weight:600;cursor:pointer}
button:active{opacity:.7}
.pri{background:var(--acc);color:var(--acc-ink)}
.ghost{background:transparent;border:1px solid var(--line)}
.danger{color:var(--bad)}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card b{font-size:18px}
.card small{color:var(--mute);display:block}
.plan{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;margin:10px 0 2px;letter-spacing:.02em}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.row>.fix{flex:0 0 auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(14,16,19,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px)}
nav button{flex:1;background:none;color:var(--mute);font-size:13px;padding:8px 4px}
nav button.on{color:var(--acc)}
nav svg{display:block;margin:0 auto 4px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* workout */
.wh{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.wh .x{width:44px;height:44px;padding:0;border-radius:50%;font-size:18px}
.wh b{font-size:20px;display:block}
.wh small{color:var(--mute)}
.dots{display:flex;gap:6px;margin-bottom:20px}
.dots span{flex:1;text-align:center;padding:8px 0;border-radius:10px;background:var(--card);color:var(--mute);font-weight:700;font-variant-numeric:tabular-nums}
.dots .d{background:#263312;color:var(--acc)}
.dots .c{outline:2px solid var(--acc);color:var(--text)}
.goal{text-align:center;font-size:18px;color:var(--mute);margin-bottom:16px}
.goal b{color:var(--text)}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;width:min(78vw,320px);height:min(78vw,320px);margin:0 auto 24px;border-radius:50%;background:var(--card);border:4px solid var(--line);padding:0}
.big span{font-size:96px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.big small{color:var(--mute);font-weight:500;font-size:13px;margin-top:10px;max-width:60%}
.big.hit{border-color:var(--acc)}
.big.hit span{color:var(--acc)}
.big.rest{border-color:var(--acc);border-style:dashed}
.center{text-align:center}
.sum{font-size:56px;font-weight:800;letter-spacing:-.03em;margin:12px 0 0}
.lvl{font-size:20px;font-weight:700;margin:6px 0}
.up{color:var(--acc)}.down{color:var(--bad)}
/* progress */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 16px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border-radius:999px;padding:8px 14px;font-weight:500}
.chips .on{background:var(--acc);color:var(--acc-ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.stats .card{margin:0}
.stats b{font-size:28px;display:block;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:4px;height:140px}
.bars i{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:3px;position:relative}
.bars i:last-child::after{content:attr(data-v);position:absolute;top:-20px;left:50%;transform:translateX(-50%);font:600 12px/1 inherit;font-style:normal;color:var(--text)}
.hist{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.hist:last-child{border:0}
.hist span{color:var(--mute)}
/* settings */
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border:0}
.line button{padding:8px 12px;font-size:14px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:40px;height:40px;padding:0;border-radius:50%}
.step b{min-width:64px;text-align:center}
input[type=text],select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-width:0;-webkit-user-select:text;user-select:text}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc)}
.empty{color:var(--mute);text-align:center;padding:24px 0}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
